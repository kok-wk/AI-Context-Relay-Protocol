name: acrp-check

# ACRP 协议合规检查：约定靠工具传播，而非靠口头提醒。
# 任何 push/PR 破坏了入口结构（文件缺失、死链、协议摘要丢失、必打标签被改）
# 都会导致 CI 失败。

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ACRP convention check
        run: bash tools/ai-first-check.sh .
